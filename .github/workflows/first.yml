name: Run Python Script

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖项（可选）
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 创建输出文件夹
        run: mkdir output

      - name: 运行 Python 脚本
        run: python main.py

      - name: 打包 output 文件夹
        run: zip -r output.zip output

      - name: 上传产物到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-folder
          path: output/
